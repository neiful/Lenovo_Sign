name: Lenovo Sign

on:
  schedule:
    - cron: '23 17 * * *'  
    
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 升级到官方最新的 checkout v4
      - uses: actions/checkout@v4

      # 2. 升级 Python 到 3.11，并升级 setup-python 到 v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run lenovo_sign.py
        env:
          GitHub_Actions: true
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python lenovo_sign.py

      - name: Commit sign history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sign_history.txt
          # 加上 [skip ci] 避免自动化签到脚本触发多余的重复构建
          git diff --staged --quiet || git commit -m "chore: 更新签到记录 $(date -u +'%Y-%m-%d') [skip ci]"
          git push
